<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KMARKET</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-max="0">

<!-- Иконки на сетке 24×24, толщина штриха 1.6, круглые концы, показ 12 px —
     кнопки окна система рисует именно такими. -->
<header class="titlebar pywebview-drag-region">
  <div class="brand">
    <span class="mark"></span>
    <span class="wordmark">KMARKET</span>
  </div>
  <div class="chrome">
    <button class="win" data-win="minimize" title="Свернуть" aria-label="Свернуть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/></svg>
    </button>
    <!-- Обе иконки лежат в разметке, меняется видимая: переписывать
         содержимое кнопки на лету WebView2 иногда не успевает отрисовать. -->
    <button class="win" id="btn-max" data-win="maximize" title="Развернуть" aria-label="Развернуть">
      <svg class="on-max" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.6 7.6h8.8v8.8H7.6z"/>
      </svg>
      <svg class="on-restore" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.4 9.4V7.6h7v7h-1.8"/>
        <path d="M7.6 9.4h7v7h-7z"/>
      </svg>
    </button>
    <button class="win danger" data-win="close" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.8 7.8l8.4 8.4"/>
        <path d="M16.2 7.8l-8.4 8.4"/>
      </svg>
    </button>
  </div>
</header>

<main id="app">

  <!-- Слева то, за чем следим. Жетон всегда первый, товары добавляются
       поиском. Выбор подсвечивается линией, как вкладки в KTRANS. -->
  <aside class="side">
    <div class="label">Слежу</div>
    <div class="assets" id="assets"></div>
    <button class="add" id="add" type="button">+ добавить товар</button>
    <span class="spacer"></span>
    <button class="range" id="refresh" type="button" title="Спросить у Blizzard свежие цены">обновить</button>
    <span class="stamp" id="stamp">загрузка…</span>
  </aside>

  <!-- ================= РАЗБОР ЖЕТОНА ИЛИ ТОВАРА ================= -->
  <section class="view is-on" data-view="asset">

    <div class="ahead">
      <span class="icon big" id="a-icon"></span>
      <div class="title">
        <div class="aname" id="a-name">Жетон WoW</div>
        <div class="isub" id="a-sub"></div>
      </div>
      <span class="spacer"></span>
      <span class="regions" id="regions">
        <button class="tab" data-region="eu">EU</button>
        <button class="tab" data-region="us">US</button>
      </span>
      <button class="range" id="untrack" type="button" hidden>не следить</button>
    </div>

    <div class="card">
      <div class="verdict">
        <div>
          <div class="label">Вердикт</div>
          <div class="vstate" id="v-state">…</div>
          <div class="price" id="v-price">—</div>
        </div>
        <div>
          <div class="vsummary" id="v-summary">Считаю историю…</div>
          <ul class="reasons" id="v-reasons"></ul>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chart-head">
        <span class="label">Цена</span>
        <span class="readout" id="probe-readout" hidden></span>
      </div>
      <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
      <div class="ranges" id="ranges">
        <button class="range" data-days="1">сутки</button>
        <button class="range" data-days="7">7 дн</button>
        <button class="range is-on" data-days="30">30 дн</button>
        <button class="range" data-days="90">90 дн</button>
        <button class="range" data-days="365">год</button>
        <button class="range" data-days="3650">всё</button>
      </div>
    </div>

    <div class="grid" id="windows"></div>

    <div class="pair">
      <div class="card" id="rhythm-card">
        <div class="label">Недельный ритм · время серверов</div>
        <div id="rhythm"></div>
      </div>
      <div class="card" id="cycle-card">
        <div class="label">Цикл контента</div>
        <div id="cycle"></div>
      </div>
    </div>
  </section>

  <!-- ================= ПОИСК ТОВАРА ================= -->
  <section class="view" data-view="search">
    <div class="card">
      <div class="label">Добавить товар</div>
      <form class="search" id="search-form">
        <input id="q" type="text" placeholder="Название, например: гелиотроп" autocomplete="off" spellcheck="false">
        <button class="range" type="submit">найти</button>
      </form>
      <div class="note" id="search-note">Ищется по товарному аукциону EU — реагенты, расходники,
        самоцветы, руны. Снаряжение и петы живут на аукционах отдельных реалмов, их здесь нет.</div>
      <div class="rows" id="results" hidden></div>
    </div>
  </section>

</main>

<div id="toast" hidden></div>
<div id="error" hidden></div>

<script src="app.js"></script>
</body>
</html>
