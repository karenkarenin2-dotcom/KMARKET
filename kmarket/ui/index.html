<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KMARKET</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-max="0">

<!-- Иконки на сетке 24×24, толщина штриха 1.6, круглые концы, показ 12 px —
     кнопки окна система рисует именно такими. -->
<header class="titlebar pywebview-drag-region">
  <div class="brand">
    <span class="mark"></span>
    <span class="wordmark">KMARKET</span>
  </div>
  <div class="chrome">
    <button class="win" data-win="minimize" title="Свернуть" aria-label="Свернуть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/></svg>
    </button>
    <!-- Обе иконки лежат в разметке, меняется видимая: переписывать
         содержимое кнопки на лету WebView2 иногда не успевает отрисовать. -->
    <button class="win" id="btn-max" data-win="maximize" title="Развернуть" aria-label="Развернуть">
      <svg class="on-max" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.6 7.6h8.8v8.8H7.6z"/>
      </svg>
      <svg class="on-restore" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.4 9.4V7.6h7v7h-1.8"/>
        <path d="M7.6 9.4h7v7h-7z"/>
      </svg>
    </button>
    <button class="win danger" data-win="close" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.8 7.8l8.4 8.4"/>
        <path d="M16.2 7.8l-8.4 8.4"/>
      </svg>
    </button>
  </div>
</header>

<main id="app">

  <nav class="tabs">
    <button class="tab is-on" data-tab="token">Жетон</button>
    <button class="tab" data-tab="auction">Аукцион</button>
    <span class="gsep"></span>
    <button class="tab" data-region="eu" id="reg-eu">EU</button>
    <button class="tab" data-region="us" id="reg-us">US</button>
    <span class="spacer"></span>
    <span class="stamp" id="stamp">загрузка…</span>
  </nav>

  <!-- ================= ЖЕТОН ================= -->
  <section class="view is-on" data-view="token">

    <div class="card">
      <div class="verdict">
        <div>
          <div class="label">Вердикт</div>
          <div class="vstate" id="v-state">…</div>
          <div class="price" id="v-price">— <span class="unit">g</span></div>
        </div>
        <div>
          <div class="vsummary" id="v-summary">Считаю историю…</div>
          <ul class="reasons" id="v-reasons"></ul>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chart-head">
        <span class="label">Цена</span>
        <span class="readout" id="probe-readout" hidden></span>
      </div>
      <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
      <!-- Сутки и неделя добавлены по просьбе Карена 2026-08-09: цена
           пересчитывается раз в 20 минут, и на коротком горизонте видно
           внутрисуточное движение, которое на 30 днях уже сглажено. -->
      <div class="ranges" id="ranges">
        <button class="range" data-days="1">сутки</button>
        <button class="range" data-days="7">7 дн</button>
        <button class="range" data-days="30">30 дн</button>
        <button class="range is-on" data-days="90">90 дн</button>
        <button class="range" data-days="365">год</button>
        <button class="range" data-days="3650">всё</button>
      </div>
    </div>

    <div class="grid" id="windows"></div>
  </section>

  <!-- ================= АУКЦИОН ================= -->
  <section class="view" data-view="auction">

    <div class="card" id="auction-note">
      <div class="chart-head">
        <span class="label">Товарный аукцион EU</span>
        <button class="range" id="a-refresh">обновить</button>
      </div>
      <div class="note" id="a-note">Загружаю…</div>
      <div class="caveat" id="a-accuracy" hidden></div>
      <div class="ready" id="a-ready" hidden></div>
    </div>

    <!-- ПОРЯДОК СЕКЦИЙ — ЭТО ОТВЕТ НА «НЕ ПОНИМАЮ, КАК ПОЛЬЗОВАТЬСЯ».
         Сверху вниз: что делать сейчас → чем это подкрепить → всё
         остальное. Первая секция раскрыта, прочие свёрнуты, чтобы экран
         не начинался с шести списков разом. -->

    <section class="card fold is-main" data-fold="stockpile">
      <button class="fold-head" type="button">
        <span class="fold-mark">−</span>
        <span class="label">Что запасать под патч</span>
        <span class="fold-sum" id="a-stockpile-sum"></span>
      </button>
      <div class="fold-body" id="a-stockpile"></div>
    </section>

    <section class="card fold is-closed" data-fold="craft">
      <button class="fold-head" type="button">
        <span class="fold-mark">+</span>
        <span class="label">Выгодно скрафтить</span>
        <span class="fold-sum" id="a-craft-sum"></span>
      </button>
      <div class="fold-body" id="a-craft"></div>
    </section>

    <!-- СЕКЦИИ «РАЗРЫВЫ В СТАКАНЕ» БОЛЬШЕ НЕТ (решение Карена 2026-08-09).
         Выкуп дешёвого хвоста дважды проверен на живом прилавке, и оба
         раза сделка не существовала: снимок Blizzard обновляется раз в
         час, а хвост разбирают за минуты. Держать это на экране значило
         бы предлагать заведомо неисполнимое. Расчёт остался в
         analytics.bargains на случай, если такт когда-нибудь изменится. -->

    <section class="card fold is-closed" data-fold="rhythm" id="a-rhythm" hidden>
      <button class="fold-head" type="button">
        <span class="fold-mark">+</span>
        <span class="label">Недельный ритм · время серверов</span>
        <span class="fold-sum" id="a-rhythm-sum"></span>
      </button>
      <div class="fold-body" id="a-rhythm-body"></div>
    </section>

    <section class="card fold is-closed" data-fold="rows">
      <button class="fold-head" type="button">
        <span class="fold-mark">+</span>
        <span class="label">Все товары под слежкой</span>
        <span class="fold-sum" id="a-rows-sum"></span>
      </button>
      <div class="fold-body">
        <div class="rows" id="a-rows"></div>
      </div>
    </section>
  </section>

</main>

<div id="error" hidden></div>

<script src="app.js"></script>
</body>
</html>
