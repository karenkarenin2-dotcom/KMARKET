name: collect

# Сбор цены жетона.
#
# ЗАЧЕМ ОКНО, А НЕ ОДИН ЗАМЕР (переделано 2026-08-06 по замерам).
# Прежняя схема «крон */10 → один замер» не работала: планировщик Actions
# будил нас раз в 1–3 часа, и за 16 суток в историю легло 12.9 точки в
# сутки вместо 72 возможных. Крон в Actions — это пожелание, а не
# расписание, и обижаться на него бессмысленно.
#
# Теперь каждый запуск держит ОКНО опроса ~55 минут: сборщик снимает цену
# раз в 5 минут всё это время. Такт Blizzard — 20 минут, значит за окно
# набегает около трёх новых точек вместо одной, и редкость пробуждений
# перестаёт быть приговором. Минуты на публичном репозитории бесплатны —
# ровно за этим он и сделан публичным.
on:
  schedule:
    # Раз в полчаса: чаще незачем, окно и так длится почти час, а лишние
    # запуски всё равно упрутся в concurrency и будут отменены.
    - cron: "0,30 * * * *"
  workflow_dispatch: # кнопка «запустить сейчас» на вкладке Actions

permissions:
  contents: write # сборщик коммитит историю в этот же репозиторий

concurrency:
  group: collect
  cancel-in-progress: false # два сборщика разом устроили бы гонку за push

jobs:
  collect:
    runs-on: ubuntu-latest
    # Окно 55 мин + запас на checkout и коммиты. Без потолка зависший
    # запуск держал бы группу concurrency и глушил все следующие.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Никакого pip: сборщик работает на голой стандартной библиотеке.
      #
      # КОММИТИМ ПАЧКАМИ ПО ХОДУ ОКНА, а не один раз в конце. Если раннер
      # умрёт или его снимет concurrency на сороковой минуте, потерянными
      # окажутся замеры максимум за последние 10 минут, а не за всё окно.
      - name: Снимать цену целое окно
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          set -u
          git config user.name "kmarket-collector"
          git config user.email "actions@users.noreply.github.com"

          # ПОЧЕМУ ЗДЕСЬ НЕТ `git pull --rebase` (поломка 2026-08-07).
          # Месячный CSV переписывается ЦЕЛИКОМ и отсортированным. Когда
          # два запуска накладываются, обе стороны переписывают один файл,
          # и rebase упирается в конфликт ВНУТРИ ДАННЫХ:
          #     CONFLICT (content): Merge conflict in data/history/us/2026-08.csv
          # Пока сборщик коммитил раз в 1–3 часа, столкнуться было почти
          # не с чем; после перехода на коммиты каждые 10 минут это стало
          # обычным делом.
          #
          # Мержить два переписанных файла мы не умеем и не будем — это
          # прямой путь к маркерам конфликта в истории цен (2026-07-26).
          # Вместо этого: проиграл гонку — откатись к облаку и ПЕРЕСНИМИ.
          # Цена жетона живёт 20 минут, так что пересъёмка почти всегда
          # возвращает ту же точку, а данные заведомо целы.
          publish() {
            if [ -z "$(git status --porcelain data)" ]; then
              echo "Новых точек нет — коммитить нечего."
              return 0
            fi
            for attempt in 1 2 3; do
              git add data
              git commit -q -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
              if git push -q; then
                return 0
              fi
              echo "Кто-то опередил с push (попытка ${attempt}) — беру облачную версию и переснимаю."
              git fetch -q origin
              git reset -q --hard origin/main
              python -m kmarket.collect || true
              if [ -z "$(git status --porcelain data)" ]; then
                return 0
              fi
            done
            echo "Опубликовать не удалось за три попытки — точки подберёт следующий отрезок."
            git fetch -q origin
            git reset -q --hard origin/main
            return 0
          }

          end=$(( $(date -u +%s) + 55 * 60 ))
          rc=0
          chunks=0

          while [ "$(date -u +%s)" -lt "$end" ]; do
            chunks=$(( chunks + 1 ))
            echo "::group::Отрезок ${chunks}"
            # Отрезок ~10 минут: три опроса с шагом 5 минут.
            python -m kmarket.collect --minutes 15 --interval 300 || rc=$?
            publish
            echo "::endgroup::"
          done

          echo "Окно закрыто: отрезков ${chunks}, код последнего отказа ${rc}."
          # Ненулевой код — только если сбор реально отваливался: молчаливо
          # вставший сбор не восстановить, он обязан краснеть в списке.
          exit $rc
