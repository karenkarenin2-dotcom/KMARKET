name: auction

# Сбор цен товарного аукциона (commodities): товары, выбранные в приложении
# (data/tracked.json), плюс тихий фон реагентов Midnight (data/reagents.json).
#
# ОТДЕЛЬНО ОТ СБОРЩИКА ЖЕТОНА — намеренно. У аукциона свой такт: Blizzard
# пересчитывает commodities раз в ЧАС, жетон — раз в 20 минут. В одном
# workflow пришлось бы либо качать 3 МБ каждые десять минут впустую, либо
# проредить жетон.
#
# Окно опроса здесь по той же причине, что и у жетона: крон Actions
# исполняется раз в 1–3 часа вместо заказанного, и для часовых данных это
# прямые пропуски снимков.
on:
  schedule:
    - cron: "7,37 * * * *" # смещение от нуля: в начале часа планировщик загружен сильнее
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction # своя группа: аукцион не должен глушить сбор жетона
  cancel-in-progress: false

jobs:
  auction:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Никакого pip: сборщик на голой стандартной библиотеке.
      - name: Снимать аукцион целое окно
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          set -u
          git config user.name "kmarket-collector"
          git config user.email "actions@users.noreply.github.com"

          # Про отсутствие `git pull --rebase` — см. подробный разбор в
          # collect.yml. Коротко: месячный CSV переписывается целиком, и
          # при наложении запусков rebase даёт конфликт ВНУТРИ ДАННЫХ.
          # Проиграл гонку — откатись к облаку и переснимай; снимок
          # дедуплицируется по времени Blizzard, повтор безвреден.
          publish() {
            if [ -z "$(git status --porcelain data)" ]; then
              echo "Снимок не обновился — коммитить нечего."
              return 0
            fi
            for attempt in 1 2 3; do
              git add data
              git commit -q -m "auction: $(date -u '+%Y-%m-%d %H:%M') UTC"
              if git push -q; then
                return 0
              fi
              echo "Кто-то опередил с push (попытка ${attempt}) — беру облачную версию и переснимаю."
              git fetch -q origin
              git reset -q --hard origin/main
              python -m kmarket.collect_auction || true
              if [ -z "$(git status --porcelain data)" ]; then
                return 0
              fi
            done
            echo "Опубликовать не удалось за три попытки — снимок подберёт следующий отрезок."
            git fetch -q origin
            git reset -q --hard origin/main
            return 0
          }

          end=$(( $(date -u +%s) + 55 * 60 ))
          rc=0

          while [ "$(date -u +%s)" -lt "$end" ]; do
            # Подтянуть свежий список слежки. Приложение отправляет его в
            # облако отдельным коммитом, и без этого новый товар начинал бы
            # писаться только со следующего запуска workflow. Fast-forward
            # не может испортить рабочие файлы: после publish дерево чистое.
            git fetch -q origin && git merge -q --ff-only origin/main || true

            # Отрезок ~35 минут: четыре опроса с шагом 10 минут. Коммиты идут
            # после каждого отрезка — смерть раннера уносит не больше него.
            python -m kmarket.collect_auction --minutes 35 --interval 600 || rc=$?

            publish
          done

          exit $rc
