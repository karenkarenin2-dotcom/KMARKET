name: auction

# Сбор товарного аукциона (commodities).
#
# ОТДЕЛЬНО ОТ СБОРЩИКА ЖЕТОНА — намеренно. У аукциона свой такт: Blizzard
# пересчитывает commodities раз в ЧАС, жетон — раз в 20 минут. В одном
# workflow пришлось бы либо качать 3 МБ каждые десять минут впустую, либо
# проредить жетон. Разные такты — разные расписания и разные файлы.
#
# Окно опроса здесь по той же причине, что и у жетона: крон Actions
# исполняется раз в 1–3 часа вместо заказанного, и для часовых данных это
# прямые пропуски снимков.
on:
  schedule:
    - cron: "7,37 * * * *" # смещение от нуля: в начале часа планировщик загружен сильнее
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction # своя группа: аукцион не должен глушить сбор жетона
  cancel-in-progress: false

jobs:
  auction:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Никакого pip: сборщик на голой стандартной библиотеке.
      - name: Снимать аукцион целое окно
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          set -u
          git config user.name "kmarket-collector"
          git config user.email "actions@users.noreply.github.com"

          # Про отсутствие `git pull --rebase` — см. подробный разбор в
          # collect.yml. Коротко: месячный CSV переписывается целиком, и
          # при наложении запусков rebase даёт конфликт ВНУТРИ ДАННЫХ.
          # Проиграл гонку — откатись к облаку и переснимай; снимок
          # дедуплицируется по времени Blizzard, повтор безвреден.
          publish() {
            if [ -z "$(git status --porcelain data)" ]; then
              echo "Снимок не обновился — коммитить нечего."
              return 0
            fi
            for attempt in 1 2 3; do
              git add data
              git commit -q -m "auction: $(date -u '+%Y-%m-%d %H:%M') UTC"
              if git push -q; then
                return 0
              fi
              echo "Кто-то опередил с push (попытка ${attempt}) — беру облачную версию и переснимаю."
              git fetch -q origin
              git reset -q --hard origin/main
              python -m kmarket.collect_auction --wide-hours 6 || true
              if [ -z "$(git status --porcelain data)" ]; then
                return 0
              fi
            done
            echo "Опубликовать не удалось за три попытки — снимок подберёт следующий отрезок."
            git fetch -q origin
            git reset -q --hard origin/main
            return 0
          }

          end=$(( $(date -u +%s) + 55 * 60 ))
          rc=0

          while [ "$(date -u +%s)" -lt "$end" ]; do
            # Отрезок ~30 минут: четыре опроса с шагом 10 минут.
            #
            # Почему не короче: чтобы измерить продажи, процесс должен
            # застать СМЕНУ часового снимка — предыдущий он держит в
            # памяти и сравнивает id лотов. На получасовом отрезке
            # граница часа попадает внутрь примерно в половине случаев,
            # и за окно из двух отрезков мы ловим её почти всегда.
            # Почему не длиннее: коммиты идут после каждого отрезка, и
            # растягивать их реже значит рисковать потерять больше при
            # смерти раннера.
            #
            # --wide-hours 6 пишет ВЕСЬ аукцион четыре раза в сутки. Это
            # временная мера на цикл патча 12.1 (12 августа) и сезона 2
            # (18 августа): список слежки подобран до патча, и новых
            # реагентов Coiled Isle в нём нет. Записать рынок целиком
            # можно только пока это происходит — потом неоткуда.
            # Замерено: ~2.3 МБ в сутки. Убрать после начала сентября.
            python -m kmarket.collect_auction --minutes 35 --interval 600 --wide-hours 6 || rc=$?

            publish
          done

          exit $rc

  # Список слежки пересобирается раз в месяц: топ ликвидности меняется
  # после патчей, и новые реагенты должны подхватываться сами. Держим в
  # этом же файле, чтобы всё про аукцион лежало в одном месте.
  watchlist:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Пересобрать список слежки
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python -m kmarket.watchlist
      - name: Закоммитить список
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Список не изменился."
            exit 0
          fi
          git config user.name "kmarket-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "watchlist: $(date -u '+%Y-%m-%d') UTC"
          git pull --rebase
          git push
